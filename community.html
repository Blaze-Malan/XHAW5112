
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Community | Next Level Gaming &amp; Esports Arena</title>
	<link rel="stylesheet" href="styles.css">
</head>

	<body class="equipment-page">
		<!-- Brand wordmark and booking action. -->
		<header class="equipment-header">
			<h1 class="equipment-wordmark">
				<span class="equipment-wordmark-top">NEXT LEVEL</span>
				<span class="equipment-wordmark-bottom">GAMING &amp; ESPORTS ARENA</span>
			</h1>
			<button class="equipment-book-button" type="button">BOOK NOW</button>
		</header>
		<!-- Equipment headline and supporting statements. -->
		<main class="equipment-intro">
			<h2>GAMES &amp; EQUIPMENT</h2>
			<p>EVERY GAME.</p>
			<p class="equipment-compromise">ZERO COMPROMISE.</p>
		</main>
		<!-- Shared esports setup image and specification panel. -->
		<section class="equipment-feature" aria-labelledby="equipment-feature-heading">
			<img src="Images/esport-background.jpg" alt="Esports gaming arena with computers and competition stations">
			<div class="equipment-feature-copy">
				<h2 id="equipment-feature-heading">THE NLGEA SETUP</h2>
				<p class="equipment-feature-tagline"><span>BUILT FOR</span><span>THE CLUTCH.</span></p>
				<hr class="equipment-spec-divider">
				<div class="equipment-specs" aria-label="Gaming specifications">
					<div class="equipment-spec-item">
						<span class="equipment-spec-value">240Hz</span>
						<span class="equipment-spec-label">MONITORS</span>
					</div>
					<div class="equipment-spec-item">
						<span class="equipment-spec-value">RTX</span>
						<span class="equipment-spec-label">GRAPHICS</span>
					</div>
				</div>
				<hr class="equipment-spec-divider">
				<div class="equipment-specs" aria-label="Response and audio specifications">
					<div class="equipment-spec-item">
						<span class="equipment-spec-value">1ms</span>
						<span class="equipment-spec-label">RESPONSE</span>
					</div>
					<div class="equipment-spec-item">
						<span class="equipment-spec-value">7.1</span>
						<span class="equipment-spec-label">AUDIO</span>
					</div>
				</div>
				<button class="equipment-book-button equipment-full-specs-button" type="button">VIEW FULL SPECS</button>
			</div>
		</section>
	<!-- Site copyright notice. -->
	<footer class="site-footer">
		<p class="copyright">2025 Next Level Gaming &amp; Esports Arena All Rights Reserved</p>
	</footer>
</body>
</html>
